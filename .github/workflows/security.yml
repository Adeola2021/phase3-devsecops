name: DevSecOps Supply Chain Security

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert Repository Owner to Lowercase
        id: vars
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Dependency Vulnerability Scan
        run: python -m pip_audit

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo:${{ github.sha }}

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate CycloneDX SBOM
        run: |
          syft \
          ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo@${{ steps.build.outputs.digest }} \
          -o cyclonedx-json=sbom.json

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Container Image
        run: |
          cosign sign --yes \
          ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo@${{ steps.build.outputs.digest }}

      - name: Verify Cosign Signature
        run: |
          cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
            ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo@${{ steps.build.outputs.digest }}

      - name: Generate Build Provenance Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: CycloneDX-SBOM
          path: sbom.json
