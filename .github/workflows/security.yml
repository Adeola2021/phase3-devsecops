name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main

jobs:
  security:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit cyclonedx-bom

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker Image
      run: |
        docker build \
          -t ghcr.io/${{ github.repository }}/supply-chain-demo:${{ github.sha }} .

    - name: Push Docker Image
      run: |
        docker push \
          ghcr.io/${{ github.repository }}/supply-chain-demo:${{ github.sha }}

    - name: Install Syft
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

    - name: Install Trivy
      uses: aquasecurity/trivy-action@0.31.0
      with:
        scan-type: image
        image-ref: ghcr.io/${{ github.repository }}/supply-chain-demo:${{ github.sha }}
        format: sarif
        output: results.sarif

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3

    - name: Sign Image
      run: |
        cosign sign --yes \
          ghcr.io/${{ github.repository }}/supply-chain-demo:${{ github.sha }}

    - name: Verify Signature
      run: |
        cosign verify \
        --certificate-identity-regexp "https://github.com/${{ github.repository }}" \
        --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        ghcr.io/${{ github.repository }}/supply-chain-demo:${{ github.sha }}

    - name: Make security gate executable
      run: chmod +x security_gate.sh

    - name: Execute Security Gate
      run: ./security_gate.sh

    - name: Upload SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif

    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: CycloneDX-SBOM
        path: sbom.json

    - name: Generate CycloneDX SBOM
      run: |
          syft \
          ghcr.io/${{ github.repository }}/supply-chain-demo:${{ github.sha }} \
          -o cyclonedx-json=sbom.json

    - name: Upload Provenance
      uses: actions/upload-artifact@v4
      with:
          name: SLSA-Provenance
          path: "*.intoto.jsonl"
