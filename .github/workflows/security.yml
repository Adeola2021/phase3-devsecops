name: DevSecOps Supply Chain Security

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:

  security:

    runs-on: ubuntu-latest

    steps:

    ##########################################################
    # Checkout
    ##########################################################

    - name: Checkout Repository
      uses: actions/checkout@v4


    ##########################################################
    # Lowercase Repository Owner
    ##########################################################

    - name: Set lowercase owner
      id: vars
      run: |
        echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT


    ##########################################################
    # Python
    ##########################################################

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install Python Packages
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit cyclonedx-bom


    ##########################################################
    # Dependency Audit
    ##########################################################

    - name: Run pip-audit
      run: |
        python -m pip_audit


    ##########################################################
    # Login to GHCR
    ##########################################################

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}


    ##########################################################
    # Docker Buildx
    ##########################################################

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3


    ##########################################################
    # Build and Push Image
    ##########################################################

    - name: Build and Push Docker Image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo:${{ github.sha }}


    - name: Generate SLSA Provenance
      uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
      with:
        image: ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo
        digest: ${{ steps.build.outputs.digest }}

    ##########################################################
    # Install Syft
    ##########################################################

    - name: Install Syft
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin


    ##########################################################
    # Generate SBOM
    ##########################################################

    - name: Generate CycloneDX SBOM
      run: |
        syft \
        ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo:${{ github.sha }} \
        -o cyclonedx-json=sbom.json


    ##########################################################
    # Install Trivy
    ##########################################################

    - name: Run Trivy Scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo:${{ github.sha }}
        format: sarif
        output: results.sarif


    ##########################################################
    # Upload SARIF
    ##########################################################

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif


    ##########################################################
    # Install Cosign
    ##########################################################

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3


    ##########################################################
    # Keyless Sign
    ##########################################################

    - name: Sign Image
      run: |
        cosign sign --yes \
        ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo@${{ steps.build.outputs.digest }}


    ##########################################################
    # Verify Signature
    ##########################################################

    - name: Verify Signature
      run: |
        cosign verify \
          --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
          --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
          ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo@${{ steps.build.outputs.digest }}


    ##########################################################
    # Upload SBOM
    ##########################################################

    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: CycloneDX-SBOM
        path: sbom.json


    ##########################################################
    # Upload Provenance
    ##########################################################

    - name: Upload Provenance
      uses: actions/upload-artifact@v4
      with:
        name: SLSA-Provenance
        path: "*.intoto.jsonl"
