name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main

jobs:
  security:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit cyclonedx-bom

    - name: Install Docker
      uses: docker/setup-buildx-action@v3

    - name: Install Syft
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

    - name: Install Trivy CLI
      run: |
        wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

    - name: Make security gate executable
      run: chmod +x security_gate.sh

    - name: Execute Security Gate
      run: ./security_gate.sh

    - name: Upload SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif

    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: CycloneDX-SBOM
        path: sbom.json
