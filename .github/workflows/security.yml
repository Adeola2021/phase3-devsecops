name: DevSecOps Supply Chain Security

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:

  security:

    runs-on: ubuntu-latest

    outputs:
      image: ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo
      digest: ${{ steps.build.outputs.digest }}

    steps:

    - uses: actions/checkout@v4

    - name: Lowercase owner
      id: vars
      run: |
        echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit

    - name: Dependency Audit
      run: python -m pip_audit

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/setup-buildx-action@v3

    - name: Build and Push Image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo:${{ github.sha }}

    - name: Install Syft
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

    - name: Generate SBOM
      run: |
        syft \
        ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo@${{ steps.build.outputs.digest }} \
        -o cyclonedx-json=sbom.json

    - name: Trivy Scan
      uses: aquasecurity/trivy-action@0.36.0
      with:
        image-ref: ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo@${{ steps.build.outputs.digest }}
        format: sarif
        output: trivy-results.sarif

    - uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif

    - uses: sigstore/cosign-installer@v3

    - name: Sign Image
      run: |
        cosign sign --yes \
        ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo@${{ steps.build.outputs.digest }}

    - name: Verify Signature
      run: |
        cosign verify \
        --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
        --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
        ghcr.io/${{ steps.vars.outputs.owner }}/supply-chain-demo@${{ steps.build.outputs.digest }}

    - uses: actions/upload-artifact@v4
      with:
        name: SBOM
        path: sbom.json


  provenance:

    needs: security

    uses: ./.github/workflows/slsa.yml

    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write

    with:
      image: ${{ needs.security.outputs.image }}
      digest: ${{ needs.security.outputs.digest }}
