apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-supply-chain-demo
spec:
  validationActions:
    - Audit
    - Deny

  matchImageReferences:
    - glob: "ghcr.io/adeola2021/*"

  validationConfigurations:
    required: true
    verifyDigest: true
    mutateDigest: true

  attestors:
    - name: githubCosign
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/adeola2021/phase3-devsecops/.github/workflows/security.yml@refs/heads/main"

        ctlog:
          url: https://rekor.sigstore.dev

  validations:
    - expression: >-
        images.containers.map(
          image,
          verifyImageSignatures(image, [attestors.githubCosign])
        ).all(result, result > 0)
      message: "Image signature verification failed."
